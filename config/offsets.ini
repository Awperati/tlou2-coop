; default binding (48 bytes)                                         rva 0x133A130
binding_default = C7 01 CC CC CC 7F 33 C0 89 41 0C 48 8B C1 48 C7 41 04 CC CC CC 7F C5 F8 57 C0 C5 F8 11 41 10 C5 F8 10 0D ?? ?? ?? ?? C5 F8 11 49 20 C3
; BoundFrame(out, locator, binding)                                  rva 0x133A1B0
boundframe_ctor = 40 53 48 83 EC 20 C7 01 CC CC CC 7F 33 C0 89 41 0C 48 8B D9 48 C7 41 04 CC CC CC 7F C5 F8 57 C0 C5 F8 11 41 10 C5 F8 10 0D ?? ?? ?? ?? C5 F8 11 49 20 41 8B 00 89 01 41 8B 40 04
; StringIds are FNV-1a 64 of the name (offset 0xcbf29ce484222325, prime 0x100000001b3).
; Player event: fnv1a64("teleport-player"), sent by the dev menu "Teleport Player".
teleport_event = 0xB805933EFC5BA6D4
; Generic event tried for NPCs: fnv1a64("teleport"). Ignored by buddies in game.
npc_teleport_event = 0x5A1A856AA0CFD6BE
; Npc::Teleport(BoundFrame*, 1, 1, 1) vtable offset, as called by the script natives
; npc-teleport (rva 0x649B90) and npc-teleport-to (rva 0x649DE0). Used when non-zero.
npc_teleport_vslot = 4520
; The puppet only moves the buddy to points within this many metres of the local
; player. A 90 m jump during a cinematic crashed the game (2026-10-11).
puppet_max_distance = 40

; EngineComponents table: the getter "return table[i]" (rva 0x126CC80). LevelMgr = entry 6.
components = 8B C1 48 8D 0D ?? ?? ?? ?? 48 8B 04 C1 C3 CC CC 44 8B C9 48 8D 0D

