; Game memory map for tlou-ii.exe (PE timestamp 67ED75F7, 2025-04-03).
; Filled in from reverse engineering. Empty pattern = feature off.
; The mod logs which features resolved in tlou2-coop.log.
;
; Each section:
;   pattern     = IDA byte pattern hitting an instruction that loads a global
;   disp_offset = byte offset of the rip-relative disp32 in that instruction
;   instr_len   = instruction length in bytes
;   hops        = pointer offsets to follow after the global, comma separated
; plus feature-specific field offsets.

[player]
; GetPlayer() at rva 0xDA8A80: "mov rcx, [PlayerHandle]" ; handle = {ptr, id}; Process* at ptr+8
; (found via the dev-menu "Teleport Player" handler, rva 0x3F86F0)
pattern = 48 8B 44 24 20 48 85 C0 75 ?? 48 8B 0D ?? ?? ?? ?? 33 C0 48 85 C9 74 ?? 8B 15 ?? ?? ?? ?? 85 D2 74 ?? 48 8B 49 08
disp_offset = 13
instr_len = 17
hops = 0x8
; pos/rot: the "teleport" event handler (rva 0xB766C0) saves Process+0x130 (position)
; and +0x140 (rotation quaternion x,y,z,w) before moving the player. Confirm in game:
; the log prints "player pos" every 5 s. Set discover = true to rerun the auto-finder.
pos = 0x130
rot = 0x140
discover = false
vel = 0x0
yaw = 0x0
health = 0x0
pos_writable = false

[engine]
print_hook = false
dialog_hook = false
; Speaker remap for every DialogManager request (sub_1403172A0). Verified live 2026-10-15.
dialog_facts_hook = true
; Barks/callouts via each actor's VoxController (sub_140331A80). Built, not run yet.
vox_hook = false
; M7 checkpoint write/restart hooks (log-only). Built, not run yet: enable for the first test.
checkpoint_hooks = true
; GetPlayer() start, rva 0xDA8A80. Patched to run our engine calls on a game fiber
; (engine code needs TEB FiberData; plain threads fault reading 0x1E00).
get_player = 48 83 EC 38 48 8B 05 ?? ?? ?? ?? 48 33 C4 48 89 44 24 28 E8 ?? ?? ?? ?? 84 C0 74 27 B9 0E 00 00 00 E8 ?? ?? ?? ?? 84 C0 74 19 48 8D 54 24 20 B9 0E 00 00 00 E8
fiber_hook = true
; Found by the function-name string it passes to its own assert (rva 0x52E940).
; Returns the first living buddy Npc*, same Process layout as the player.
get_any_buddy_fn = class Npc *__cdecl GetAnyBuddy(void)
; Event::Send(result, sender, eventId, ProcessHandle*, arg0..arg3)   rva 0x156F870
