; Pickup classes for [sync] Pickups (coop.ini). Matched as substrings of the pickup process name.
; Names come from the game's own level data (world-watchtower.psarc, pak68/*-ingame.pak, 2026-10-19), e.g.
;   item-pickup-ammo-pistol-1230, item-pickup-alcohol-small-96, item-pickup-explosive-large-39,
;   item-pickup-parts-medium-196, item-pickup-supplements-small-371   (loot: shared in mixed)
;   coll-wat-approach-tower-letter, obj-col-the-soldier-note-1, card-ai, int-wat-shambler-journal-1   (collectibles)
;   obj-the-radio-door-key-1, the-auditorium-keys, obj-the-seattle-map-2   (story items and keys)
[pickups]
; Always shared (removed on the other PC in every rule but log): story objects and keys.
AlwaysShared = obj-the-, -key-, -keys, door-key
; Each player keeps their own in mixed and perplayer: collectibles, notes, journals, cards, coins.
PerPlayer = coll-, obj-col-, card-, journal, -note, coin, artifact, safe-
