; TLOU2 Co-op roster.
; Chapter keys are the game's own world packs (build\pc\main\world-*.psarc).
; protagonist = who the story has you play. companions = who co-op players 1..3 become.
; Empty companions = the chapter is solo in the story; co-op players then pick
; a character in coop.ini (Character = ...) or get a random one.
;
; STATUS: chapter -> companion mapping is a best guess from the story.
; Verify each one in game and correct it here. No rebuild needed.

; ---- characters ------------------------------------------------------------
; weapons/craftables are tokens. [items] maps them to engine item ids (filled by RE).

[character.ellie]
weapons = pistol, revolver, hunting_rifle, pump_shotgun, bow, silenced_smg, flamethrower
craftables = health_kit, molotov, smoke_bomb, trap_mine, explosive_arrow, silencer
model = ellie

[character.abby]
weapons = military_pistol, hunting_pistol, semi_auto_rifle, shotgun, crossbow, flamethrower
craftables = health_kit, molotov, pipe_bomb, stun_bomb, crossbow_bolt
model = abby

[character.dina]
