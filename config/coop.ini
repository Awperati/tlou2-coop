; TLOU2 Co-op settings. Copy next to tlou-ii.exe together with version.dll.

[session]
; host or client. The host runs the story; clients join it.
Mode = host
PlayerName = Player
SessionName = TLOU2 Co-op
; Client only. Leave empty to auto-find a host on the LAN.
HostAddress =
Port = 47820
MaxPlayers = 2

[character]
; Used when the chapter has no story companion for your slot.
; ellie, abby, dina, jesse, lev, yara, tommy, joel, manny, owen, mel, or random
Character = random

[body]
; The other player's body: a spawned NPC wearing their look, walked to their position.
; client = on the partner's PC (shows the host), always = on any PC, off = never.
Auto = client
; Look the host's body wears on the partner's PC.
HostLook = ellie-seattle

[sync]
; Enemy health and deaths follow the host (the partner's hits are sent to the host).
Enemies = true
; The partner restarts from the checkpoint when the host does; a partner death restarts both.
Checkpoints = true
; Either player opening the pause menu freezes the other's game clock.
Pause = true

[teleport]
; Keyboard key name (T, F1..F12, ...) or virtual-key code like 0x54.
HoldKey = T
; Also accept a controller button: back, lb, rb, ls, rs, none
HoldPad = back
HoldSeconds = 1.5
FarDistance = 35
CooldownSeconds = 5
BlockInCombat = false
; Seconds before a scene transition goes ahead without stragglers. 0 = wait.
TransitionForceSeconds = 0

[accessibility]
; Spoken prompts through Windows narrator voice (SAPI).
SpeakPrompts = true
; Sound cue when the teleport prompt appears and when it fires.
SoundCues = true
; Hold can be replaced by a single press (toggle) for players who cannot hold.
PressInsteadOfHold = false

[debug]
LogFile = tlou2-coop.log
; Solo check: teleports you 3 m ahead through the engine. Empty to disable.
TestTeleportKey = F10
Verbose = false
